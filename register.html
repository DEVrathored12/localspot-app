<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — LocalSpot</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-page">

  <div class="auth-layout">
    <div class="auth-panel">
      <a href="index.html" class="logo logo-light mb-2">
        <span class="logo-mark">L</span><span>ocal<strong>Spot</strong></span>
      </a>
      <h2>Join LocalSpot</h2>
      <p>Connect with thousands of local shops, customers, and creators in your area.</p>
      <div class="auth-features">
        <div class="auth-feat"><i class="fas fa-user-plus"></i><span>Free to Join</span></div>
        <div class="auth-feat"><i class="fas fa-map-marker-alt"></i><span>Hyperlocal Discovery</span></div>
        <div class="auth-feat"><i class="fas fa-rupee-sign"></i><span>Earn as a Creator</span></div>
        <div class="auth-feat"><i class="fas fa-shield-alt"></i><span>Verified Listings</span></div>
      </div>
      <div class="auth-panel-decoration"></div>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-form-card">
        <h2>Create Account</h2>
        <p class="auth-sub">Already have an account? <a href="login.html">Sign in</a></p>

        <div class="role-tabs">
          <button class="role-tab active" data-role="customer">Customer</button>
          <button class="role-tab" data-role="shop">Shop Owner</button>
          <button class="role-tab" data-role="creator">Creator</button>
        </div>

        <!-- Customer Form -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label>First Name</label>
              <div class="input-icon-wrap">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="First name" required/>
              </div>
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <div class="input-icon-wrap">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Last name" required/>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-icon-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" placeholder="you@example.com" required/>
            </div>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <div class="input-icon-wrap">
              <i class="fas fa-phone"></i>
              <input type="tel" placeholder="+91 98765 43210" required/>
            </div>
          </div>

          <!-- Shop-specific fields (hidden by default) -->
          <div class="shop-fields" style="display:none">
            <div class="form-group">
              <label>Shop Name</label>
              <div class="input-icon-wrap">
                <i class="fas fa-store"></i>
                <input type="text" placeholder="Your shop name"/>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Category</label>
                <div class="input-icon-wrap">
                  <i class="fas fa-tag"></i>
                  <select>
                    <option>Select category</option>
                    <option>Food & Spices</option>
                    <option>Clothing</option>
                    <option>Electronics</option>
                    <option>Beauty</option>
                    <option>Jewellery</option>
                    <option>Services</option>
                    <option>Gifts</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label>Area / Locality</label>
                <div class="input-icon-wrap">
                  <i class="fas fa-map-marker-alt"></i>
                  <input type="text" placeholder="e.g. Bandra West"/>
                </div>
              </div>
            </div>
          </div>

          <!-- Creator-specific fields -->
          <div class="creator-fields" style="display:none">
            <div class="form-group">
              <label>Creator Speciality</label>
              <div class="input-icon-wrap">
                <i class="fas fa-film"></i>
                <select>
                  <option>Select speciality</option>
                  <option>Reels / Short Videos</option>
                  <option>Shop Tours</option>
                  <option>Product Highlights</option>
                  <option>All Types</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="regPassword" placeholder="Create a strong password" required/>
              <button type="button" class="toggle-pass" onclick="togglePass('regPassword')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-check">
            <input type="checkbox" id="termsCheck" required/>
            <label for="termsCheck">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            Create Account <i class="fas fa-arrow-right"></i>
          </button>
          <div class="divider"><span>or sign up with</span></div>
          <div class="social-auth">
            <button type="button" class="social-btn google"><i class="fab fa-google"></i> Google</button>
            <button type="button" class="social-btn facebook"><i class="fab fa-facebook"></i> Facebook</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const roleTabs = document.querySelectorAll('.role-tab');
    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const role = tab.dataset.role;
        document.querySelector('.shop-fields').style.display = role === 'shop' ? 'block' : 'none';
        document.querySelector('.creator-fields').style.display = role === 'creator' ? 'block' : 'none';
      });
    });
    function handleRegister(e) {
      e.preventDefault();
      const role = document.querySelector('.role-tab.active').dataset.role;
      const map = { customer: 'shops.html', shop: 'dashboard-shop.html', creator: 'dashboard-creator.html' };
      window.location.href = map[role] || 'index.html';
    }
    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
    // Pre-select role from URL param
    const params = new URLSearchParams(window.location.search);
    const typeParam = params.get('type');
    if (typeParam) {
      const tab = document.querySelector(`.role-tab[data-role="${typeParam}"]`);
      if (tab) tab.click();
    }
  </script>
</body>
</html>
