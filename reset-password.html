<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — LocalSpot</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-page">

  <div class="auth-layout">
    <div class="auth-panel">
      <a href="index.html" class="logo logo-light mb-2">
        <span class="logo-mark">L</span><span>ocal<strong>Spot</strong></span>
      </a>
      <h2>Reset Password</h2>
      <p>Enter your new password below to regain access to your LocalSpot account.</p>
      <div class="auth-panel-decoration"></div>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-form-card">
        <h2>New Password</h2>
        <p class="auth-sub">Remember it? <a href="login.html">Sign in</a></p>

        <form id="resetForm" class="auth-form" onsubmit="handleReset(event)">
          <div class="form-group">
            <label>New Password</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="newPassword" placeholder="Enter new password" minlength="6" required/>
              <button type="button" class="toggle-pass" onclick="togglePass('newPassword')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" required/>
              <button type="button" class="toggle-pass" onclick="togglePass('confirmPassword')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            Reset Password <i class="fas fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:5000/api' : 'https://localspot-ngn1.onrender.com/api';

    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      showMsg('Invalid or missing reset link. Please request a new one.', true);
      document.getElementById('resetForm').style.display = 'none';
    }

    async function handleReset(e) {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm  = document.getElementById('confirmPassword').value;
      if (password !== confirm) return showMsg('Passwords do not match.', true);

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerHTML = 'Resetting... <i class="fas fa-spinner fa-spin"></i>';
      clearMsg();

      try {
        const res  = await fetch(`${API}/auth/reset-password/${token}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!data.success) {
          showMsg(data.message || 'Reset failed. Link may have expired.', true);
          btn.disabled = false;
          btn.innerHTML = 'Reset Password <i class="fas fa-arrow-right"></i>';
          return;
        }
        showMsg('Password reset! Redirecting to login...');
        setTimeout(() => window.location.href = 'login.html', 2000);
      } catch {
        showMsg('Server error. Please try again.', true);
        btn.disabled = false;
        btn.innerHTML = 'Reset Password <i class="fas fa-arrow-right"></i>';
      }
    }

    function showMsg(msg, isError = false) {
      let el = document.getElementById('resetMsg');
      if (!el) {
        el = document.createElement('div');
        el.id = 'resetMsg';
        document.getElementById('resetForm').prepend(el);
      }
      el.style.cssText = `padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;border:1px solid ${isError ? '#c8d8f0' : '#b7e4c7'};background:${isError ? '#eef3fb' : '#e8f8f0'};color:${isError ? '#1a3c6e' : '#27ae60'}`;
      el.textContent = msg;
    }

    function clearMsg() {
      const el = document.getElementById('resetMsg');
      if (el) el.remove();
    }

    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
